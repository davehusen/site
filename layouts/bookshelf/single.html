{{ define "main" }}
<div class="container">
    {{ .Content }}
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const placeholder = document.getElementById('last-updated-placeholder');
        if (placeholder) {
            placeholder.id = 'last-updated-box';
            placeholder.innerHTML = '<strong>Last updated:</strong> {{ .Lastmod.Format "January 2, 2006" }}';
        }
    });
</script>
{{ end }}
